.hand {
  cursor: pointer;
  outline: none;
}
.hand-inner {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.hand:hover .hand-inner,
.hand:focus-visible .hand-inner,
.hand[data-active="true"] .hand-inner {
  transform: translateY(14px) scale(1.04);
}
.held {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.hand:hover .held,
.hand:focus-visible .held,
.hand[data-active="true"] .held {
  transform: translateY(-16px) scale(1.18);
}
.hand-ring {
  opacity: 0;
  transition: opacity 0.2s;
}
.hand:hover .hand-ring,
.hand:focus-visible .hand-ring,
.hand[data-active="true"] .held {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.hand:hover .held,
.hand:focus-visible .held,
.hand[data-active="true"] .held {
  transform: translateY(-16px) scale(1.18);
}
.hand-ring {
  opacity: 1;
}
@media (prefers-reduced-motion: reduce) {
  .hand-inner {
    transition: none;
  }
}

/* Animasi */
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes handIn { from { opacity: 0; transform: translateY(-70px); } to { opacity: 1; transform: none; } }
@keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 50% { opacity: .8; } 100% { opacity: 0; transform: translateY(-18px); } }
@keyframes flame { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(.88, 1.14); } }
@keyframes dash { to { stroke-dashoffset: -28; } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes spinSlow { to { transform: rotate(360deg); } }
@keyframes heroText { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes heroBag { from { opacity: 0; transform: translateY(34px) rotate(-5deg) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes bagFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(1.2deg); } }
@keyframes floatBean { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-22px) rotate(calc(var(--r, 0deg) + 10deg)); } }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes drumSpin { to { transform: rotate(360deg); } }
@keyframes traySpin { to { transform: rotate(360deg); } }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(54px); opacity: 0; } }
@keyframes mist { 0%, 100% { transform: translateX(-8px); opacity: .35; } 50% { transform: translateX(10px); opacity: .7; } }
@keyframes barFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ripple { from { opacity: .5; transform: scale(.9); } to { opacity: 0; transform: scale(1.25); } }
.page-in { animation: fadeUp .55s cubic-bezier(.2,.8,.2,1) both; }
.step-in { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; }
.photo-pop { animation: popIn .5s cubic-bezier(.2,.8,.2,1) both; }
.pop-in { animation: popIn .22s cubic-bezier(.2,.8,.2,1) both; }
.steam { animation: steam 2.4s ease-in-out infinite; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .7s ease-in-out infinite; }
.flow { animation: dash .5s linear infinite; }
.bump { animation: bump .4s ease; }

.hero-text { animation: heroText .7s cubic-bezier(.2,.8,.2,1) both; }
.hero-bag { animation: heroBag .85s cubic-bezier(.2,.8,.2,1) both; }
.bag-float { animation: bagFloat 6s ease-in-out infinite 1s; }
.float-bean { animation: floatBean 7s ease-in-out infinite; opacity: .8; }
.ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; }
.marquee-track { animation: marquee 28s linear infinite; }
.drum { transform-box: fill-box; transform-origin: 50% 50%; animation: drumSpin 9s linear infinite; }
.tray { transform-box: fill-box; transform-origin: 50% 50%; animation: traySpin 7s linear infinite; }
.drip { animation: drip 1.6s ease-in infinite; }
.mist { animation: mist 9s ease-in-out infinite; }
.bar-fill { transform-origin: left center; animation: barFill linear forwards; }
.latte { transform-box: fill-box; transform-origin: 50% 50%; animation: spinSlow 60s linear infinite; }
.ripple { transform-box: fill-box; transform-origin: 50% 50%; animation: ripple 1.6s ease-out infinite; }
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.reveal.in { opacity: 1; transform: none; }
.img-zoom { transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .5s; }
.group:hover .img-zoom { transform: scale(1.06); }
.lift { transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; }
.lift:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -22px rgba(61,38,21,.35); }

## Bahan dan alat

- 20 gram bubuk robusta sangrai gelap (giling halus)
- 200 ml air panas (\xB195\xB0C)
- 1-2 sendok makan susu kental manis
- Saringan kain atau French press

## Langkah menyeduh

1. Panaskan air hingga mendidih, diamkan sekitar 30 detik agar suhunya turun ke kisaran 95\xB0C.
2. Masukkan bubuk kopi ke saringan kain atau French press.
3. Tuang air secara perlahan hingga semua bubuk basah, tunggu 30 detik agar kopi mengembang.
4. Tuang sisa air, lalu seduh total 3 sampai 4 menit.
5. Saring ke gelas yang sudah berisi susu kental manis, aduk rata.

## Tips agar rasanya mirip warung

Gunakan robusta dengan sangrai gelap dan jangan terlalu halus supaya tidak pahit berlebihan. Takaran 1:10 (satu bagian kopi, sepuluh bagian air) memberi kepekatan yang pas untuk dicampur susu. Tambahkan es batu jika ingin versi dingin.`},{id:"a02",slug:"panduan-v60-untuk-gayo-natural",title:"Panduan V60 untuk Gayo Natural",excerpt:"Resep V60 sederhana untuk menonjolkan manis buah Gayo Natural tanpa membuatnya terlalu asam.",author:"Tim KupiLab",date:"2026-10-26",readMinutes:6,body:`Gayo Natural punya manis buah yang jelas. Tujuan seduhan V60 adalah menjaga manis itu tetap bulat, bukan tajam.

## Resep dasar

- 15 gram kopi, giling medium-halus (seperti garam meja)
- 225 ml air bersuhu 92 sampai 94\xB0C (rasio 1:15)
- Waktu total sekitar 2 menit 30 detik

## Langkah

1. Bilas kertas filter dengan air panas, buang airnya.
2. Masukkan kopi, ratakan permukaannya.
3. Bloom: tuang 45 ml air, tunggu 40 detik.
4. Tuang sampai 140 ml dengan gerakan melingkar, lalu jeda sebentar.
5. Tuang sisanya sampai 225 ml.
6. Biarkan turun hingga habis. Putar dripper pelan agar bed kopi rata.

## Menyesuaikan rasa

- Terlalu asam atau tipis: gilingan lebih halus, atau suhu air dinaikkan sedikit.
- Terlalu pahit atau kering: gilingan lebih kasar, atau suhu diturunkan.
- Kurang manis: perpanjang bloom 10 detik dan tuang lebih perlahan.

Catat tiap percobaan. Perubahan kecil satu per satu lebih mudah dipelajari daripada mengubah semuanya sekaligus.`},{id:"a03",slug:"rahasia-kopi-tarik-ulee-kareng",title:"Rahasia Kopi Tarik Ulee Kareng",excerpt:"Mengapa kopi dari kawasan Ulee Kareng begitu dikenal? Dari sangrai hingga cara menyaring dengan kain.",author:"Tim KupiLab",date:"2026-11-02",readMinutes:4,body:`Ulee Kareng adalah kawasan di Banda Aceh yang namanya identik dengan kopi. Warung-warungnya terkenal dengan seduhan pekat yang disaring memakai kain.

## Sangrai tradisional

Biji, terutama robusta, disangrai cukup gelap sehingga menghasilkan rasa cokelat pahit dan rempah. Sangrai gelap membuat kopi tetap terasa kuat saat dicampur susu atau gula.

## Saringan kain

Bubuk kopi diseduh dalam kantong kain panjang. Air panas dituang, lalu kopi dipindahkan dari satu wadah ke wadah lain dengan gerakan menarik. Gerakan ini mendinginkan seduhan sedikit, memberi aerasi, dan menghasilkan buih tipis di permukaan.

## Mencobanya di rumah

- Gunakan kopi giling halus-medium.
- Rasio mulai dari 1:10.
- Tuang air 95\xB0C, tunggu 3 sampai 4 menit.

## Tiga proses utama

- Washed: kulit dan lendir dibersihkan sebelum penjemuran. Rasa bersih, asam jernih.
- Natural: buah dijemur utuh. Rasa manis buah, body lebih berat.
- Honey: sebagian lendir dibiarkan menempel. Manis, seimbang.

## Apa itu fermentasi anaerob?

Pada fermentasi anaerob, buah kopi difermentasi tanpa oksigen dalam wadah tertutup selama beberapa hari. Mikroba memecah gula buah dan menghasilkan senyawa aroma seperti buah beri dan rempah manis. Tidak ada alkohol dalam produk akhirnya: biji dicuci, dijemur, lalu disangrai di atas 200\xB0C.

## Yang perlu dijaga

Fermentasi terlalu lama dapat memunculkan rasa asam cuka atau terlalu menyengat. Karena itu petani mengatur waktu dan suhu dengan hati-hati, lalu menjemur perlahan agar rasa stabil.

## Cara menikmatinya
